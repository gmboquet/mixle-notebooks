name: attribution
on:
  push:
    branches: [release/0.8.3]
  pull_request:
    branches: [release/0.8.3]
jobs:
  attribution:
    name: Refuse authorship this project does not claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/check_commit_attribution.py --base 7e37784
